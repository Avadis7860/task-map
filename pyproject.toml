[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 : <1.27 dégrade en silence (metadata 2.3, NOTICE non embarqué)
build-backend = "hatchling.build"

[project]
name = "task-map"
version = "0.1.0"
description = "Deterministic engine over a graph of missions: readiness ranking over the dependency DAG, and STAMP anchoring (north-star axis, epic served/unblocked, blueprint applied). Sixth tool of the -map family."
readme = "README.md"
requires-python = ">=3.11"  # tomllib stdlib (config .taskmap.toml sans dépendance)
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AvAgency", email = "contact@avagency.pro" }]
keywords = ["task-map", "stamp", "northstar", "backlog", "blueprint", "task-graph", "prompt-context"]
# Cœur stdlib-pur : AUCUNE dépendance obligatoire → installable partout, offline, sans compilation native.
# (La résolution des refs blueprint via le MCP forgemaster-catalogs, en P5, sera une intégration optionnelle à
# dégradation honnête — jamais une dépendance dure.)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
# Une seule porte d'entrée unifiée (cf. docs/architecture.md).
taskmap = "taskmap.cli:main"

[project.urls]
Repository = "https://github.com/Avadis7860/task-map"

[tool.hatch.build.targets.wheel]
packages = ["src/taskmap"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["taskmap"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Les fixtures contiendront des tasks d'échantillon (frontmatter) qui NE sont PAS des tests à collecter.
norecursedirs = ["fixtures"]
